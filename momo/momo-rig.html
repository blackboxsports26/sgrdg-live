<title>Momo Bewegungs-Rig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
  :root {
    --bg: #f3f5f1;
    --surface: #ffffff;
    --ink: #1c211d;
    --muted: #5d685f;
    --line: #d6ddd5;
    --accent: #2f7a55;
    --accent-ink: #ffffff;
    --accent-soft: #e2efe7;
    --focus: #1f5fbf;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #141815;
      --surface: #1d231f;
      --ink: #e8ede8;
      --muted: #9aa79d;
      --line: #313b34;
      --accent: #5cc08d;
      --accent-ink: #0f1a13;
      --accent-soft: #223328;
      --focus: #8ab4ff;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #141815;
    --surface: #1d231f;
    --ink: #e8ede8;
    --muted: #9aa79d;
    --line: #313b34;
    --accent: #5cc08d;
    --accent-ink: #0f1a13;
    --accent-soft: #223328;
    --focus: #8ab4ff;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding-inline: 20px;
    padding-block: 28px 40px;
    display: grid;
    gap: 20px;
  }
  header { display: grid; gap: 2px; }
  .eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    font-family: "Baloo 2", "Nunito Sans", system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(30px, 6vw, 44px);
    line-height: 1.05;
    margin: 0;
    text-wrap: balance;
  }
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }

  /* The stage stays paper-white in both themes: Momo is coloring-book line art. */
  .stage {
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    position: relative;
  }
  .stage svg { display: block; width: 100%; height: auto; max-width: 100%; }
  .caption {
    position: absolute;
    left: 12px;
    right: 12px;
    top: 10px;
    display: grid;
    gap: 0;
    color: #111111;
    pointer-events: none;
  }
  .caption .term {
    font-family: "Baloo 2", "Nunito Sans", system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(16px, 3.2vw, 22px);
    line-height: 1.15;
  }
  .caption .de { font-size: 13px; color: #4a524c; }
  .caption .count {
    position: absolute;
    right: 0;
    top: 0;
    font-family: "Baloo 2", "Nunito Sans", system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(20px, 4vw, 28px);
    font-variant-numeric: tabular-nums;
  }
  #bones[hidden], .view[hidden] { display: none; }

  .panel { display: grid; gap: 18px; }
  .group { display: grid; gap: 8px; }
  .label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .moves { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font: inherit;
    font-weight: 700;
    color: var(--ink);
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .val { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 3.5ch; text-align: right; }
  .check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .check input { accent-color: var(--accent); width: 18px; height: 18px; }
  .steps {
    margin: 0;
    padding-left: 1.4em;
    display: grid;
    gap: 2px;
    color: var(--muted);
  }
  .steps li.on { color: var(--ink); font-weight: 700; }
  .note {
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 14px 16px;
    display: grid;
    gap: 6px;
  }
  .note p { margin: 0; max-width: 60ch; }
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">Black-Box Sports Academy · Taekwon-Do</span>
    <h1>Momo, die Schildkröte</h1>
  </header>

  <div class="layout">
    <div class="stage">
      <svg id="stage" viewBox="170 290 700 1050" role="img" aria-label="Momo, die Comic-Schildkröte im Dobok, läuft Saju Jirugi">
        <defs>
          <!-- vector shell used where a cut-out piece leaves a gap, and for the back view -->
          <g id="shellSide">
            <ellipse cx="472" cy="862" rx="164" ry="170" stroke-width="7" />
            <ellipse cx="472" cy="862" rx="136" ry="144" stroke-width="5" />
            <path class="thin" d="M 310 862 L 336 862 M 318 800 L 342 808 M 340 744 L 360 760" />
          </g>
          <g id="shellBack">
            <ellipse cx="520" cy="850" rx="178" ry="196" />
            <ellipse cx="520" cy="850" rx="146" ry="162" stroke-width="6" />
            <path class="thin" d="M 342 850 L 374 850 M 698 850 L 666 850 M 360 760 L 388 776 M 680 760 L 652 776 M 360 940 L 388 924 M 680 940 L 652 924 M 404 690 L 424 714 M 636 690 L 616 714 M 404 1010 L 424 986 M 636 1010 L 616 986 M 520 654 L 520 688 M 520 1046 L 520 1012" />
            <path d="M 520 770 L 580 806 L 580 894 L 520 930 L 460 894 L 460 806 Z" stroke-width="6" />
            <path d="M 520 770 L 520 688 M 580 806 L 650 770 M 580 894 L 652 930 M 520 930 L 520 1012 M 460 894 L 388 930 M 460 806 L 390 770" stroke-width="6" />
          </g>
        </defs>

        <g fill="#ffffff" stroke="#111111" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="520" cy="1250" rx="300" ry="52" />
          <ellipse cx="520" cy="1246" rx="270" ry="38" stroke-width="4" />

          <g id="turn">
            <g class="view" id="vFront">
              <g class="root">
                <g class="torsoT"><use href="#shellSide" /></g>
                <g class="legL"></g>
                <g class="legR"></g>
                <g class="torsoT">
                  <image href="assets/torso4.png" x="301" y="660" width="375" height="359" />
                  <g class="armL"></g>
                  <g class="armR"></g>
                  <g class="head"><image href="assets/head4.png" x="318" y="390" width="387" height="311" /></g>
                </g>
              </g>
            </g>

            <g class="view" id="vBack" hidden>
              <g class="root">
                <g class="legL"></g>
                <g class="legR"></g>
                <g class="torsoT">
                  <g transform="translate(1040 0) scale(-1 1)">
                    <image href="assets/torso4.png" x="301" y="660" width="375" height="359" />
                  </g>
                  <use href="#shellBack" />
                  <g class="armL"></g>
                  <g class="armR"></g>
                  <g class="head"><image href="assets/headback.png" x="318" y="390" width="387" height="311" /></g>
                </g>
              </g>
            </g>

            <g class="view" id="vSide" hidden>
              <g class="face">
                <g class="root">
                  <g class="legR"></g>
                  <g class="torsoT"><g class="armR"></g></g>
                  <g class="legL"></g>
                  <g class="torsoT">
                    <g transform="translate(515 0) scale(0.86 1) translate(-515 0)">
                      <use href="#shellSide" />
                      <image href="assets/torso4.png" x="301" y="660" width="375" height="359" />
                    </g>
                    <g class="armL"></g>
                    <g class="head">
                      <image href="assets/head3.png" x="84" y="627" width="329" height="263"
                        transform="translate(540 692) scale(1.17) translate(-232 -884)" />
                    </g>
                  </g>
                </g>
              </g>
            </g>
          </g>
        </g>
      </svg>
      <div class="caption" aria-live="off">
        <span class="term" id="cap-term">Narani Junbi Sogi</span>
        <span class="de" id="cap-de">Bereitschaftsstellung</span>
        <span class="count" id="cap-count"></span>
      </div>
    </div>

    <div class="panel">
      <div class="group">
        <span class="label" id="moves-label">Bewegung</span>
        <div class="moves" role="group" aria-labelledby="moves-label" id="moves"></div>
      </div>

      <div class="group">
        <label class="label" for="speed">Tempo</label>
        <div class="row">
          <input type="range" id="speed" min="0.3" max="1.8" step="0.1" value="1">
          <span class="val" id="speed-val">1.0×</span>
          <button type="button" id="pause" aria-pressed="false">Pause</button>
        </div>
      </div>

      <div class="group" id="steps-group">
        <span class="label">Ablauf Saju Jirugi</span>
        <ol class="steps" id="steps"></ol>
      </div>

      <div class="note">
        <p>Momo ist aus euren Ausmalbildern ausgeschnitten: Kopf, Dobok mit Gürtel und Panzer, Ärmel, Fäuste und Beine. Die Abfolge folgt eurem Saju-Jirugi-Video.</p>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  const style = document.createElementNS(NS, "style");
  style.textContent = ".thin{stroke-width:5;fill:none}";
  $("stage").prepend(style);

  const rad = (d) => (d * Math.PI) / 180;
  const FLOOR = 1238;
  // arm: sleeve from image 6 (scaled to image 4), fist from image 5
  const SLEEVE = { href: "assets/sleeve6.png", box: [634, 579, 117, 112], pivot: [640, 635], cuff: 746, s: 1.18 };
  const FIST = { href: "assets/fist5.png", box: [439, 705, 94, 108], wrist: [487, 806], s: 1.05 };
  const ARM_LEN = (SLEEVE.cuff - SLEEVE.pivot[0]) * SLEEVE.s;
  const LEGS = {
    L: { href: "assets/legL4.png", box: [337, 955, 186, 281], hip: [432, 985] },
    R: { href: "assets/legR4.png", box: [518, 955, 156, 285], hip: [598, 985] },
  };
  const LEG_LEN = 252;

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.append(e);
    return e;
  }

  function buildArm(g) {
    const sh = el("g", {}, g);
    const sleeve = el("g", {}, sh);
    const inner = el("g", { transform: `rotate(90) scale(${SLEEVE.s}) translate(${-SLEEVE.pivot[0]} ${-SLEEVE.pivot[1]})` }, sleeve);
    const [x, y, w, h] = SLEEVE.box;
    el("image", { href: SLEEVE.href, x, y, width: w, height: h }, inner);
    const fist = el("g", {}, sh);
    const [fx, fy, fw, fh] = FIST.box;
    const fi = el("g", { transform: `rotate(180) scale(${FIST.s}) translate(${-FIST.wrist[0]} ${-FIST.wrist[1]})` }, fist);
    el("image", { href: FIST.href, x: fx, y: fy, width: fw, height: fh }, fi);
    // the fist sits under the cuff
    sh.insertBefore(fist, sleeve);
    return { g, sh, sleeve, fist };
  }
  function buildLeg(g, s) {
    const L = LEGS[s];
    const [x, y, w, h] = L.box;
    el("image", { href: L.href, x, y, width: w, height: h }, g);
    return { g, hip: L.hip };
  }

  // sign: +1 means a positive angle swings the limb toward the viewer's left.
  function makeRig(id, cfg) {
    const root = $(id);
    const rig = { el: root, cfg, arms: {}, legs: {} };
    for (const s of ["L", "R"]) {
      rig.arms[s] = buildArm(root.querySelector(".arm" + s));
      rig.legs[s] = buildLeg(root.querySelector(".leg" + s), cfg.legSrc[s]);
    }
    rig.root = root.querySelector(".root");
    rig.torso = root.querySelectorAll(".torsoT");
    rig.head = root.querySelector(".head");
    return rig;
  }

  const RIGS = {
    front: makeRig("vFront", {
      sh: { L: [448, 778], R: [628, 778] }, armSign: { L: 1, R: -1 },
      legSrc: { L: "L", R: "R" }, legSign: { L: 1, R: -1 }, legShift: { L: 0, R: 0 },
      waist: [515, 960], neck: [515, 690],
    }),
    back: makeRig("vBack", {
      sh: { L: [612, 778], R: [432, 778] }, armSign: { L: -1, R: 1 },
      legSrc: { L: "R", R: "L" }, legSign: { L: -1, R: 1 }, legShift: { L: 0, R: 0 },
      waist: [520, 960], neck: [515, 690],
    }),
    side: makeRig("vSide", {
      sh: { L: [505, 782], R: [535, 772] }, armSign: { L: -1, R: -1 },
      legSrc: { L: "L", R: "R" }, legSign: { L: -1, R: -1 }, legShift: { L: 70, R: -50 },
      waist: [515, 960], neck: [540, 692],
    }),
  };

  const REST = { x: 0, air: 0, torso: 0, head: 0, shL: 6, uaL: 1, hideL: 0, shR: 6, uaR: 1, hideR: 0, hipL: 3, hipR: 3 };

  function applyRig(rig, p) {
    const c = rig.cfg;
    const drop = Math.max(Math.cos(rad(p.hipL)), Math.cos(rad(p.hipR))) * LEG_LEN;
    const y = FLOOR - 985 - drop - p.air;
    rig.root.setAttribute("transform", `translate(${p.x} ${y})`);
    const t = `rotate(${p.torso} ${c.waist[0]} ${c.waist[1]})`;
    rig.torso.forEach((g) => g.setAttribute("transform", t));
    rig.head.setAttribute("transform", `rotate(${p.head} ${c.neck[0]} ${c.neck[1]})`);
    for (const s of ["L", "R"]) {
      const A = rig.arms[s];
      const [sx, sy] = c.sh[s];
      A.g.style.display = p["hide" + s] ? "none" : "";
      A.sh.setAttribute("transform", `translate(${sx} ${sy}) rotate(${c.armSign[s] * p["sh" + s]})`);
      A.sleeve.setAttribute("transform", `scale(1 ${p["ua" + s]})`);
      A.fist.setAttribute("transform", `translate(0 ${ARM_LEN * p["ua" + s] - 6})`);
      const Lg = rig.legs[s];
      const [hx, hy] = Lg.hip;
      const dx = c.legShift[s];
      Lg.g.setAttribute("transform", `translate(${dx} 0) rotate(${c.legSign[s] * p["hip" + s]} ${hx} ${hy})` + (dx ? ` translate(${hx} 0) translate(${-hx} 0)` : ""));
    }
  }

  // ---------- Poses ----------
  const other = (s) => (s === "L" ? "R" : "L");
  const READY = { hipL: 5, hipR: 5, shL: -16, uaL: 0.9, shR: -16, uaR: 0.9 };
  const chamber = (s, view) => (view === "side"
    ? { ["sh" + s]: -18, ["ua" + s]: 0.85 }
    : { ["sh" + s]: 6, ["ua" + s]: 0.85 });
  function stance(s, view) {
    const o = other(s);
    if (view === "side") return { ["hip" + s]: 24, ["hip" + o]: -22 };
    return { ["hip" + s]: 15, ["hip" + o]: 11 };
  }
  function punch(arm, view) {
    const base = chamber(other(arm), view);
    if (view === "side") return { ...base, ["sh" + arm]: 90, ["ua" + arm]: 1, torso: 2 };
    if (view === "back") return { ...base, ["hide" + arm]: 1 };
    return { ...base, ["sh" + arm]: -62, ["ua" + arm]: 0.7, torso: -2 };
  }
  function lowBlock(arm, view) {
    const base = chamber(other(arm), view);
    if (view === "side") return { ...base, ["sh" + arm]: 38, ["ua" + arm]: 1 };
    return { ...base, ["sh" + arm]: 36, ["ua" + arm]: 1 };
  }
  function prepBlock(arm, view) {
    const base = chamber(other(arm), view);
    if (view === "side") return { ...base, ["sh" + arm]: 150, ["ua" + arm]: 0.7 };
    return { ...base, ["sh" + arm]: -140, ["ua" + arm]: 0.75 };
  }

  // ---------- Saju Jirugi choreography ----------
  const TERMS = {
    ready: ["Narani Junbi Sogi", "Bereitschaftsstellung"],
    punch: ["Gunnun So Kaunde Ap Jirugi", "Gehstellung, Fauststoß Mitte"],
    block: ["Gunnun So Najunde Bakat Palmok Makgi", "Gehstellung, Abwehr unten"],
    turn: ["Drehung um 90°", "Wechsel der Richtung"],
  };
  const viewKind = (v) => (v === "sideL" || v === "sideR" ? "side" : v);

  function buildPattern() {
    const K = [];
    let t = 0, count = 0;
    const add = (dt, view, pose, term, counted) => {
      t += dt;
      if (counted) count++;
      K.push({ t, view, pose: { ...REST, ...pose }, term, count: counted ? count : null });
    };
    add(0, "front", READY, "ready");
    const runs = [
      { first: "R", dirs: ["sideL", "back", "sideR", "front"] },
      { first: "L", dirs: ["sideR", "back", "sideL", "front"] },
    ];
    for (const run of runs) {
      const lead = other(run.first);
      add(1.4, "front", { ...stance(lead, "front"), ...punch(run.first, "front") }, "punch", true);
      let blockArm = lead;
      for (const dir of run.dirs) {
        const vk = viewKind(dir);
        add(0.9, dir, { ...stance(blockArm, vk), ...prepBlock(blockArm, vk) }, "turn");
        add(0.35, dir, { ...stance(blockArm, vk), ...lowBlock(blockArm, vk) }, "block", true);
        const next = other(blockArm);
        add(0.9, dir, { ...stance(next, vk), ...punch(next, vk) }, "punch", true);
        blockArm = next;
      }
      add(1.0, "front", READY, "ready");
    }
    add(1.6, "front", READY, "ready");
    return { keys: K, total: t };
  }
  const PATTERN = buildPattern();

  // ---------- Loops (front view) ----------
  const wave = (t) => Math.sin(2 * Math.PI * t);
  const cyc = (t) => (1 - Math.cos(2 * Math.PI * t)) / 2;
  const LOOPS = {
    stehen: {
      name: "Stehen", period: 3.2,
      pose: (t) => ({ head: 3 * wave(t), torso: 0.8 * wave(t + 0.25), shL: 6 + 3 * wave(t), shR: 6 + 3 * wave(t + 0.5) }),
    },
    hampelmann: {
      name: "Hampelmann", period: 1.0,
      pose: (t) => {
        const s = cyc(t);
        return { shL: 6 + 150 * s, shR: 6 + 150 * s, hipL: 3 + 15 * s, hipR: 3 + 15 * s, air: 50 * Math.abs(Math.sin(2 * Math.PI * t)) };
      },
    },
  };

  // ---------- Playback ----------
  const TWEEN = 0.28, TURN = 0.42;
  const easeOut = (x) => 1 - Math.pow(1 - x, 3);
  const lerpPose = (a, b, k) => {
    const o = {};
    for (const key in a) o[key] = key.startsWith("hide") ? (k < 0.5 ? a[key] : b[key]) : a[key] + (b[key] - a[key]) * k;
    return o;
  };
  function patternFrame(T) {
    const K = PATTERN.keys;
    let i = 0;
    while (i + 1 < K.length && K[i + 1].t <= T) i++;
    const k = K[i], prev = K[Math.max(0, i - 1)];
    const dt = T - k.t;
    if (i > 0 && prev.view !== k.view) {
      const u = Math.min(1, dt / TURN);
      if (u < 0.5) return { view: prev.view, pose: prev.pose, squash: 1 - 0.85 * (u / 0.5), key: k };
      return { view: k.view, pose: k.pose, squash: 0.15 + 0.85 * ((u - 0.5) / 0.5), key: k };
    }
    const u = easeOut(Math.min(1, dt / TWEEN));
    return { view: k.view, pose: lerpPose(prev.pose, k.pose, i === 0 ? 1 : u), squash: 1, key: k };
  }

  let mode = "saju";
  let speed = 1, paused = false, last = null, phase = 0, patT = 0;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) paused = true;

  const VIEW_RIG = { front: RIGS.front, back: RIGS.back, sideL: RIGS.side, sideR: RIGS.side };
  function showView(v, squash) {
    RIGS.front.el.toggleAttribute("hidden", v !== "front");
    RIGS.back.el.toggleAttribute("hidden", v !== "back");
    RIGS.side.el.toggleAttribute("hidden", !(v === "sideL" || v === "sideR"));
    RIGS.side.el.querySelector(".face").setAttribute("transform", v === "sideL" ? "translate(1040 0) scale(-1 1)" : "");
    $("turn").setAttribute("transform", `translate(520 0) scale(${squash} 1) translate(-520 0)`);
  }

  const capTerm = $("cap-term"), capDe = $("cap-de"), capCount = $("cap-count");
  const stepItems = [];
  PATTERN.keys.filter((k) => k.count).forEach((k) => {
    const li = document.createElement("li");
    li.textContent = TERMS[k.term][1];
    $("steps").append(li);
    stepItems.push(li);
  });
  let lastCount = -1, lastTerm = "";
  function setCaption(term, count) {
    if (term !== lastTerm) {
      capTerm.textContent = TERMS[term][0];
      capDe.textContent = TERMS[term][1];
      lastTerm = term;
    }
    if (count !== lastCount) {
      capCount.textContent = count ? String(count) : "";
      stepItems.forEach((li, j) => li.classList.toggle("on", j + 1 === count));
      lastCount = count;
    }
  }

  function render() {
    if (mode === "saju") {
      const f = patternFrame(patT);
      showView(f.view, f.squash);
      applyRig(VIEW_RIG[f.view], f.pose);
      setCaption(f.key.term, f.key.count || (f.key.term === "turn" ? lastCount : 0));
    } else {
      showView("front", 1);
      applyRig(RIGS.front, { ...REST, ...LOOPS[mode].pose(phase) });
    }
  }

  const movesEl = $("moves");
  const MODES = [["saju", "Saju Jirugi"], ...Object.entries(LOOPS).map(([k, v]) => [k, v.name])];
  for (const [key, name] of MODES) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = name;
    b.setAttribute("aria-pressed", String(key === mode));
    b.addEventListener("click", () => {
      mode = key; phase = 0; patT = 0; lastCount = -1; lastTerm = "";
      movesEl.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      document.querySelector(".caption").hidden = key !== "saju";
      $("steps-group").hidden = key !== "saju";
      render();
    });
    movesEl.append(b);
  }
  $("speed").addEventListener("input", (e) => {
    speed = parseFloat(e.target.value);
    $("speed-val").textContent = speed.toFixed(1) + "×";
  });
  const pauseBtn = $("pause");
  const syncPause = () => {
    pauseBtn.textContent = paused ? "Weiter" : "Pause";
    pauseBtn.setAttribute("aria-pressed", String(paused));
  };
  pauseBtn.addEventListener("click", () => { paused = !paused; syncPause(); });
  syncPause();

  // frame-accurate hook for video export
  window.momoSeek = (seconds) => { paused = true; syncPause(); mode = "saju"; patT = seconds % PATTERN.total; render(); };
  window.momoPatternLength = PATTERN.total;

  function frame(now) {
    if (last === null) last = now;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) {
      if (mode === "saju") patT = (patT + dt * speed) % PATTERN.total;
      else phase = (phase + (dt * speed) / LOOPS[mode].period) % 1;
    }
    render();
    requestAnimationFrame(frame);
  }
  render();
  requestAnimationFrame(frame);
})();
</script>
